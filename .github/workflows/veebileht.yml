# Ehitab MkDocsi veebilehe ja avaldab selle GitHub Pagesis (haru gh-pages).
name: Veebileht

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  avalda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: mkdocs build --strict
      - run: mkdocs gh-deploy --force
