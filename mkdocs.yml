site_name: Linuxi ja BSD kursus
site_description: Eestikeelne Linuxi ja BSD kursus nullist süsteemihalduseni
docs_dir: docs
copyright: "© 2026 Rain Koor, Haapsalu Kutsehariduskeskus · CC BY-SA 4.0"

theme:
  name: material
  language: et
  features:
    - navigation.sections
    - navigation.footer
    - content.code.copy
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Tume režiim
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Hele režiim

hooks:
  - hooks/callouts.py

extra_css:
  - stylesheets/kursus.css

markdown_extensions:
  - tables
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

