site_name: Linuxi kursus
site_description: Eestikeelne Linuxi kursus nullist süsteemihalduseni
docs_dir: docs
copyright: "© 2026 Rain Koor, Haapsalu Kutsehariduskeskus · CC BY-SA 4.0"

theme:
  name: material
  language: et
  features:
    - navigation.sections
    - navigation.footer
    - content.code.copy
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Tume režiim
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Hele režiim

markdown_extensions:
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences

nav:
  - Avaleht: index.md
  - Kursuse kava: kava.md
